name: Publish connected Pages
on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: Verified HTTPS processing server origin
        required: true
        type: string
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || vars.RECALL_APP_URL != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_APP_URL: ${{ inputs.backend_url || vars.RECALL_APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check the configured server
        run: |
          node --input-type=module -e '
          const url=new URL(process.env.VITE_APP_URL);
          if(url.protocol!=="https:" || url.username || url.password || url.port || url.pathname!=="/" || url.search || url.hash)throw Error("Use an HTTPS server origin.");
          const response=await fetch(url.origin+"/api/health",{signal:AbortSignal.timeout(15000)});
          if(!response.ok || (await response.json()).status!=="ok")throw Error("The processing server is unavailable.");'
      - run: npm ci && npm test -- --run --pool=threads && npm run build:pages
        working-directory: web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist-pages
      - uses: actions/deploy-pages@v4
        id: deployment
