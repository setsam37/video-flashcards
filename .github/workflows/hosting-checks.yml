name: Hosting checks
on:
  push:
    branches: [main, feature/render-backend, feature/free-backend]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-and-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-disposable-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-disposable-password@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest backend/tests -q
        env:
          PYTHONPATH: backend
      - run: npm ci && npm test -- --run --pool=threads && npm run build && npm run build:pages
        working-directory: web
      - run: docker build -t recall:check .
      - name: Smoke test container and persistent disk
        run: python scripts/container_check.py
      - name: Container logs on failure
        if: failure()
        run: docker logs recall-check || true
