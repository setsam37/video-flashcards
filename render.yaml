services:
  - type: web
    name: recall-video-flashcards
    runtime: docker
    branch: main
    plan: free
    region: ohio
    numInstances: 1
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: APP_MODE
        value: hosted
      - key: DATA_DIR
        value: /tmp/recall
      - key: EPHEMERAL_HOSTING
        value: "true"
      - key: VIDEO_UPLOADS_ENABLED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: PAGES_ORIGIN
        value: https://setsam37.github.io
      - key: PUBLIC_SIGNUP
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_EMAILS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
